---
name: Release

'on':
  push:
    branches: [master]
    paths: ['charts/**', '.github/workflows/release.yaml']
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false  # never abandon a push halfway

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # A chart is released when its <chart>-<version> tag does not exist yet: the tag is the release's
  # last step, so a release that failed halfway (pushed, not attested) is picked up again by a rerun.
  # CI's version increment check makes every change to a chart bump its version, but only against the
  # base the PR was tested on: two PRs bumping the same version (Renovate's, opened side by side) merge
  # as one version. A chart that changed since its version's tag fails the run rather than going unreleased
  prepare:
    name: Charts to release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      charts: ${{ steps.collect.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the tags, and the history to diff against them
          persist-credentials: false

      - name: Collect unreleased versions
        id: collect
        run: |
          charts=() stale=()
          for chart in charts/*/; do
            name="$(yq '.name' "$chart/Chart.yaml")"
            version="$(yq '.version' "$chart/Chart.yaml")"
            tag="${name}-${version}"
            if ! git rev-parse --quiet --verify "refs/tags/${tag}" > /dev/null; then
              echo "${name} ${version}: to release"
              charts+=("$name")
            elif git diff --quiet "$tag" HEAD -- "$chart"; then
              echo "${name} ${version}: already released"
            else
              echo "::error::${name} changed since ${tag} without a version bump: bump charts/${name}/Chart.yaml"
              git diff --stat "$tag" HEAD -- "$chart"
              stale+=("$name")
            fi
          done
          (( ${#stale[@]} == 0 )) || exit 1
          jq -cn '$ARGS.positional' --args "${charts[@]}" | sed 's/^/charts=/' >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.chart }}
    needs: prepare
    if: needs.prepare.outputs.charts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the <chart>-<version> tag
      packages: write  # push to ghcr.io
      id-token: write  # attestation signing
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.prepare.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # Both with the workflow's own GITHUB_TOKEN (packages: write): Helm keeps its registry logins in
      # its own file, while actions/attest pushes the attestation with Docker's credentials
      - name: Log in to GitHub Container Registry (Helm)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: helm registry login ghcr.io --username "$ACTOR" --password-stdin <<< "$GH_TOKEN"

      - name: Log in to GitHub Container Registry (Docker)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A version already in the registry (a rerun after a failed attestation) is not pushed again:
      # repackaging would change its digest. Its digest is read back instead
      - name: Package and push
        id: push
        run: |
          version="$(yq '.version' "charts/${CHART}/Chart.yaml")"
          if helm pull "oci://${REGISTRY}/${CHART}" --version "$version" --destination existing > push.log 2>&1; then
            echo "${CHART} ${version} is already in the registry: attesting it as pushed"
          else
            helm package "charts/${CHART}" --destination dist
            helm push dist/*.tgz "oci://${REGISTRY}" 2>&1 | tee push.log
          fi
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          [[ -n "$digest" ]] || { echo '::error::No digest in the helm output'; cat push.log; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          push-to-registry: true
          subject-name: ${{ env.REGISTRY }}/${{ matrix.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Verify Attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: gh attestation verify --repo "$REPO" "oci://${REGISTRY}/${CHART}@${DIGEST}"

      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ matrix.chart }}-${{ steps.push.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$SHA"
