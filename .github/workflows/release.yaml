---
name: Release

'on':
  push:
    branches: [master]
    paths: ['charts/**']
  workflow_dispatch:

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release
  cancel-in-progress: false  # never abandon a push halfway

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # A chart is released when its Chart.yaml version is not in the registry yet: CI's version
  # increment check makes every change to a chart bump it
  prepare:
    name: Charts to release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      charts: ${{ steps.collect.outputs.charts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: helm registry login ghcr.io --username "$ACTOR" --password-stdin <<< "$GH_TOKEN"

      - name: Collect unreleased versions
        id: collect
        run: |
          charts=()
          for chart in charts/*/; do
            name="$(yq '.name' "$chart/Chart.yaml")"
            version="$(yq '.version' "$chart/Chart.yaml")"
            if helm show chart "oci://${REGISTRY}/${name}" --version "$version" > /dev/null 2>&1; then
              echo "${name} ${version}: already released"
            else
              echo "${name} ${version}: to release"
              charts+=("$name")
            fi
          done
          jq -cn '$ARGS.positional' --args "${charts[@]}" | sed 's/^/charts=/' >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.chart }}
    needs: prepare
    if: needs.prepare.outputs.charts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the <chart>-<version> tag
      packages: write  # push to ghcr.io
      id-token: write  # attestation signing
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(needs.prepare.outputs.charts) }}
    env:
      CHART: ${{ matrix.chart }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: helm registry login ghcr.io --username "$ACTOR" --password-stdin <<< "$GH_TOKEN"

      - name: Package and push
        id: push
        run: |
          helm package "charts/${CHART}" --destination dist
          package="$(ls dist/*.tgz)"
          helm push "$package" "oci://${REGISTRY}" 2>&1 | tee push.log
          digest="$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)"
          [[ -n "$digest" ]] || { echo '::error::No digest in helm push output'; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "version=$(yq '.version' "charts/${CHART}/Chart.yaml")" >> "$GITHUB_OUTPUT"

      - name: Attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          push-to-registry: true
          subject-name: ${{ env.REGISTRY }}/${{ matrix.chart }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Verify Attestation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: gh attestation verify --repo "$REPO" "oci://${REGISTRY}/${CHART}@${DIGEST}"

      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ matrix.chart }}-${{ steps.push.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh api "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$SHA"
