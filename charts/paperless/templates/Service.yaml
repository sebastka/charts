---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless.fullname" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "paperless") | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "paperless.selectorLabels" (list . "paperless") | nindent 4 }}
  ports:
    - {name: http, protocol: TCP, port: {{ .Values.service.port }}, targetPort: http}
