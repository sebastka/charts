{{- if .Values.httpRoute.enabled }}
{{- $fullname := include "paperless.fullname" . }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "paperless") | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- with .Values.httpRoute.extraRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    - matches: [path: {type: PathPrefix, value: /}]
      backendRefs: [{name: {{ $fullname }}, kind: Service, port: {{ .Values.service.port }}}]
      {{- with .Values.httpRoute.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
