{{- if .Values.valkey.enabled }}
{{- $name := include "paperless.componentName" (list . "valkey") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "valkey") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "valkey") | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "paperless.selectorLabels" (list . "valkey") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperless.labels" (list . "valkey") | nindent 8 }}
        {{- with .Values.valkey.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.valkey.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with include "paperless.imagePullSecrets" . | trim }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- toYaml .Values.valkey.podSecurityContext | nindent 8 }}
      {{- with include "paperless.scheduling" .Values.valkey | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: valkey
          image: {{ include "paperless.image" (list . .Values.valkey.image) }}
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          args:
            {{- toYaml .Values.valkey.args | nindent 12 }}
          securityContext:
            {{- toYaml .Values.valkey.securityContext | nindent 12 }}
          ports:
            - {name: valkey, protocol: TCP, containerPort: 6379}
          lifecycle: {preStop: {exec: {command: [sleep, '30']}}}
          startupProbe: {tcpSocket: {port: valkey}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {tcpSocket: {port: valkey}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {tcpSocket: {port: valkey}, initialDelaySeconds: 10, periodSeconds: 120}
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "valkey") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "paperless.selectorLabels" (list . "valkey") | nindent 4 }}
  ports:
    - {name: valkey, protocol: TCP, port: 6379, targetPort: valkey}
{{- end }}
