{{- if .Values.gotenberg.enabled }}
{{- $name := include "paperless.componentName" (list . "gotenberg") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "gotenberg") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "gotenberg") | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "paperless.selectorLabels" (list . "gotenberg") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "paperless.labels" (list . "gotenberg") | nindent 8 }}
        {{- with .Values.gotenberg.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.gotenberg.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with include "paperless.imagePullSecrets" . | trim }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        {{- toYaml .Values.gotenberg.podSecurityContext | nindent 8 }}
      {{- with include "paperless.scheduling" .Values.gotenberg | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: gotenberg
          # Dockerfile: https://github.com/gotenberg/gotenberg/blob/main/build/Dockerfile
          image: {{ include "paperless.image" (list . .Values.gotenberg.image) }}
          imagePullPolicy: {{ .Values.gotenberg.image.pullPolicy }}
          args:
            {{- toYaml .Values.gotenberg.args | nindent 12 }}
          securityContext:
            {{- toYaml .Values.gotenberg.securityContext | nindent 12 }}
          ports:
            - {name: http, protocol: TCP, containerPort: 3000}
          startupProbe: {httpGet: {port: http, path: /health}, initialDelaySeconds: 2, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {port: http, path: /health}, initialDelaySeconds: 10, periodSeconds: 120}
          readinessProbe: {httpGet: {port: http, path: /health}, initialDelaySeconds: 10, periodSeconds: 120}
          resources:
            {{- toYaml .Values.gotenberg.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "paperless.labels" (list . "gotenberg") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "paperless.selectorLabels" (list . "gotenberg") | nindent 4 }}
  ports:
    - {name: http, protocol: TCP, port: 80, targetPort: http}
{{- end }}
