{{- $name := include "zabbix.componentName" (list . "web") }}
{{- $serverName := include "zabbix.componentName" (list . "server") }}
{{- $db := .Values.database }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" (list . "web") | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" (list . "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "zabbix.selectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zabbix.podLabels" (list . "web") | nindent 8 }}
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "zabbix.configChecksum" (list . "web") | nindent 8 }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Two containers, one process each, where upstream's image runs nginx and php-fpm together
      # under supervisord. They share the pod's loopback, so the FastCGI port is not on the
      # network at all.
      containers:
        - name: nginx
          image: {{ include "zabbix.image" (list .Values.web.nginx.image .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.web.nginx.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.web.nginx.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.nginx.resources | nindent 12 }}
          ports:
            - {name: http, protocol: TCP, containerPort: 8080}
          startupProbe:
            httpGet: {port: http, path: /ping}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {port: http, path: /ping}
            periodSeconds: 60
          readinessProbe:
            httpGet: {port: http, path: /ping}
            periodSeconds: 30
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            # Compiled with --pid-path=/run/nginx and its temp paths under /var/lib/nginx, so both
            # have to be writable under a read-only root. Logs are already /dev/stdout and stderr.
            - {name: nginx-run, mountPath: /run/nginx}
            - {name: nginx-tmp, mountPath: /var/lib/nginx/tmp}
            - {name: tmp, mountPath: /tmp}
        - name: php
          image: {{ include "zabbix.image" (list .Values.web.php.image .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.web.php.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.web.php.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.php.resources | nindent 12 }}
          ports:
            - {name: fastcgi, protocol: TCP, containerPort: 9000}
          startupProbe:
            tcpSocket: {port: fastcgi}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: {port: fastcgi}
            periodSeconds: 60
          volumeMounts:
            # Where the frontend looks: CConfigFile::CONFIG_FILE_PATH, relative to its root
            - {name: config, mountPath: /usr/share/zabbix/conf/zabbix.conf.php, subPath: zabbix.conf.php, readOnly: true}
            - {name: config, mountPath: /etc/php85/conf.d/zz-zabbix.ini, subPath: zabbix-php.ini, readOnly: true}
            - {name: database, mountPath: /run/secrets/database, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: database
          secret:
            secretName: {{ default $serverName $db.existingSecret }}
            items:
              - {key: {{ $db.existingSecretKey }}, path: password}
        - {name: nginx-run, emptyDir: {}}
        - {name: nginx-tmp, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
