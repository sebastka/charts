---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zabbix.componentName" (list . "server") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" (list . "server") | nindent 4 }}
data:
  {{- include "zabbix.serverConfigData" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zabbix.componentName" (list . "web") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix.labels" (list . "web") | nindent 4 }}
data:
  {{- include "zabbix.webConfigData" . | nindent 2 }}
